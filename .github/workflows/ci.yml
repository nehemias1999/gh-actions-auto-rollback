# ==============================================================================
# Description: CI workflow for pull request validation. Runs linting,
#   type checking, tests with coverage enforcement, Docker image build,
#   and container health check.
# Trigger: pull_request to main branch
# Usage: runs automatically on pull requests to main; validate locally
#   with `act pull_request --workflows .github/workflows/ci.yml`
# Dependencies: actions/setup-python@v5, actions/cache@v4,
#   docker/build-push-action@v6
# Exit codes: 0 when all jobs pass; non-zero when any lint, type,
#   test, build, or health step fails
# ==============================================================================

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE: "gh-actions-auto-rollback"
  DOCKER_TAG: "pr-${{ github.event.number }}"
  # Path to the Python application source
  APP_PATH: "src"

jobs:
  # ---------------------------------------------------------------------------
  # Lint job: runs ruff to check code style and catch common errors
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lint dependencies
        run: pip install ruff

      - name: Run ruff check
        run: ruff check ${{ env.APP_PATH }}

  # ---------------------------------------------------------------------------
  # Typecheck job: runs mypy for static type analysis
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install typecheck dependencies
        run: pip install mypy

      - name: Run mypy
        run: mypy ${{ env.APP_PATH }}

  # ---------------------------------------------------------------------------
  # Test job: runs pytest with coverage, fails if coverage < 80%
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest with coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          pip install -e ${{ env.APP_PATH }}[dev]
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          cd ${{ env.APP_PATH }}
          python -m pytest tests/ -v --cov=app \
            --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # Docker build job: builds the Docker image with PR-specific tag
  # Uses load-only mode (no push) for local testing in subsequent jobs
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Health check job: rebuilds the image (each job runs on a fresh runner, so
  # the image loaded in docker-build is not available here), starts the
  # container, verifies /health returns HTTP 200, then stops the container.
  # ---------------------------------------------------------------------------
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name test-container \
            -p 8080:8080 \
            -e PORT=8080 \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Wait for container to be ready
        run: |
          for i in {1..30}; do
            if docker exec test-container curl --fail --silent \
              http://localhost:8080/health > /dev/null 2>&1; then
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container... (attempt $i/30)"
            sleep 2
          done
          echo "Container failed to become ready"
          docker logs test-container
          exit 1

      - name: Verify health endpoint
        run: |
          response=$(curl --fail --silent http://localhost:8080/health)
          echo "Health response: $response"

      - name: Stop and remove container
        if: always()
        run: |
          docker stop test-container
          docker rm test-container
